# Production: postgres + minio + migrate (chạy một lần) + web + worker + cloudflared.
# KHÔNG công bố cổng nào ra host: truy cập công khai chỉ qua Cloudflare Tunnel (cloudflared → http://web:3000).
# Chạy:  docker compose --env-file .env -f docker/compose.prod.yml up -d --build
#
# Mạng:
#   internal (internal: true) — postgres, minio chỉ nằm ở đây, không có đường ra Internet và không thể truy cập từ ngoài.
#   egress                    — web/worker (gọi nhà cung cấp AI) và cloudflared (kết nối tunnel).
name: submaker

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://submaker:${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD (chuỗi URL-an toàn, ví dụ openssl rand -hex 24)}@postgres:5432/submaker
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-submaker}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Cần đặt MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Cần đặt MINIO_ROOT_PASSWORD}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Cần đặt APP_ENCRYPTION_KEY}
  AUTH_SECRET: ${AUTH_SECRET:?Cần đặt AUTH_SECRET}
  APP_URL: ${APP_URL:?Cần đặt APP_URL (https://tên-miền-của-bạn)}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Cần đặt ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Cần đặt ADMIN_PASSWORD}
  # Production PHẢI chặn URL không an toàn (chống SSRF)
  ALLOW_INSECURE_PROVIDER_URLS: 'false'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: submaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: submaker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U submaker -d submaker']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [internal]

  # Chạy migration một lần rồi thoát; web/worker chỉ khởi động sau khi xong.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    command: ['npx', 'tsx', 'src/lib/db/migrate.ts']
    restart: 'no'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks: [internal, egress]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *app-env
    # Dừng êm: cho phép job đang chạy kịp ghi trạng thái trước khi bị tắt
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks: [internal, egress]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Cần đặt CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    networks: [egress, internal]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  pgdata:
  miniodata:

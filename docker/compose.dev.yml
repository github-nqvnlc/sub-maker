# Môi trường dev: chỉ PostgreSQL + MinIO, cổng chỉ bind 127.0.0.1.
# Chạy:  docker compose --env-file .env -f docker/compose.dev.yml up -d
# Ghi chú: image minio/minio không còn trên Docker Hub; dùng bản MinIO của Chainguard.
# Bucket riêng tư do ứng dụng tự tạo khi khởi động (src/lib/storage/client.ts: ensureBucket).
name: submaker-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: submaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: submaker
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U submaker -d submaker']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Cần đặt MINIO_ROOT_USER trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Cần đặt MINIO_ROOT_PASSWORD trong .env}
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
